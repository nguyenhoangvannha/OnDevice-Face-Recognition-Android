name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FaceNet ExecuTorch model; the Gradle `downloadModel` task skips the download when the file exists.
  MODEL_URL: https://huggingface.co/shubhxm0204/facenet-executorch/resolve/main/vggface2-inception-resnetv1-xnnpack-fp32
  MODEL_SHA256: 06927e2f1e272686258d57fe6a8abaf8efce7e61a26d7b13e6ba40fa130251e2
  MODEL_PATH: app/src/main/assets/model.pte

jobs:
  android:
    name: Unit tests + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache model.pte
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: facenet-model-${{ env.MODEL_SHA256 }}

      - name: Fetch and verify model.pte
        run: |
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p "$(dirname "$MODEL_PATH")"
            curl -fL --retry 3 --retry-delay 5 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -

      - name: Unit tests and debug build
        run: bash ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  python-client:
    name: Python client tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        working-directory: clients/python
        run: python -m unittest -v test_xperia_face_client

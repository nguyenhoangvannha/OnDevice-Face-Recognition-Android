name: Release APK

# Builds a signed release APK and attaches it to a GitHub Release.
# Required repository secrets (names only; see docs/coprocessor/ci-and-release.md):
#   KEYSTORE_BASE_64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEYSTORE_ALIAS, RELEASE_KEY_PASSWORD
# Missing secrets fail the run before anything is built; no unsigned APK is published.
#
# Tag handling:
# - push of a v* tag: builds that tag; the release is a prerelease when the tag contains '-'.
# - manual run (workflow_dispatch) on a branch: builds the branch head. The tag is the `tag`
#   input, or, when empty, v<versionName>-<yyyymmdd>.<shortsha> (UTC date). A missing tag is
#   created on that commit after the APK is built and verified; a tag that already points to a
#   different commit fails the run. Manual runs are prereleases unless `prerelease` is unticked.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (v*). Empty = v<versionName>-<yyyymmdd>.<shortsha>. Created if missing."
        required: false
        default: ""
      prerelease:
        description: Mark the GitHub Release as a prerelease
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MODEL_URL: https://huggingface.co/shubhxm0204/facenet-executorch/resolve/main/vggface2-inception-resnetv1-xnnpack-fp32
  MODEL_SHA256: 06927e2f1e272686258d57fe6a8abaf8efce7e61a26d7b13e6ba40fa130251e2
  MODEL_PATH: app/src/main/assets/model.pte

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check tag and signing secrets
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE_64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEYSTORE_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions (docs/coprocessor/ci-and-release.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          else
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
              [ -n "$version" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
              tag="v${version}-$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)"
            fi
            prerelease="${INPUT_PRERELEASE:-true}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "::error::Invalid tag '$tag' (must match ^v[0-9A-Za-z._+-]+$)"; exit 1
          fi
          create_tag=false
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha 2>/dev/null)"; then
            if [ "$existing" != "$sha" ]; then
              echo "::error::Tag $tag already exists on $existing, not on $sha"; exit 1
            fi
            echo "Tag $tag already exists on $sha"
          else
            [ "$GITHUB_EVENT_NAME" = "push" ] && { echo "::error::Pushed tag $tag not found"; exit 1; }
            create_tag=true
            echo "Tag $tag will be created on $sha after a successful build"
          fi
          {
            echo "TAG=$tag"
            echo "TAG_SHA=$sha"
            echo "CREATE_TAG=$create_tag"
            echo "PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache model.pte
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: facenet-model-${{ env.MODEL_SHA256 }}

      - name: Fetch and verify model.pte
        run: |
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p "$(dirname "$MODEL_PATH")"
            curl -fL --retry 3 --retry-delay 5 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -

      - name: Decode keystore
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE_64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Verify signature and rename
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/FaceNet-Coprocessor-$TAG.apk"
          (cd dist && sha256sum "FaceNet-Coprocessor-$TAG.apk" > "FaceNet-Coprocessor-$TAG.apk.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CREATE_TAG" = "true" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$TAG_SHA" > /dev/null
            echo "Created tag $TAG on $TAG_SHA"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
